<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapBooth — Photobooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="playful">
  <div class="bg-decor" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">📸</span>
      <h1>SnapBooth</h1>
    </div>
    <div class="theme-picker">
      <label for="themeSelect">Tema</label>
      <select id="themeSelect">
        <option value="playful">🎉 Playful Party</option>
        <option value="pastel">🌸 Pastel Dream</option>
        <option value="elegant">🖤 Elegant Noir</option>
        <option value="retro">📼 Retro Pop</option>
        <option value="mint">🌿 Fresh Mint</option>
      </select>
    </div>
  </header>

  <main class="stage">
    <section class="booth">
      <div class="viewfinder" id="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <div class="frame-overlay" id="frameOverlay"></div>
        <div class="countdown" id="countdown"></div>
        <div class="flash" id="flash"></div>
        <div class="cam-error" id="camError">
          <p>😕 Kamera tidak tersedia</p>
          <p class="hint">Izinkan akses kamera di browser, atau pakai mode <b>Uji Coba</b> di bawah.</p>
        </div>
      </div>

      <div class="controls">
        <div class="mode-switch">
          <button class="mode-btn active" data-mode="single">📷 Single</button>
          <button class="mode-btn" data-mode="strip">🎞️ Strip 4</button>
        </div>

        <button class="shutter" id="shutterBtn"><span></span></button>

        <div class="side-controls">
          <button class="icon-btn" id="flipBtn" title="Balik kamera">🔄</button>
          <button class="icon-btn" id="countdownBtn" title="Countdown: 3 detik">⏱️ 3s</button>
          <button class="icon-btn" id="demoBtn" title="Mode uji coba tanpa kamera">🧪 Demo</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <section class="card">
        <h2>🎨 Filter</h2>
        <div class="filter-grid" id="filterGrid"></div>
      </section>

      <section class="card">
        <h2>🖼️ Bingkai</h2>
        <div class="frame-grid" id="frameGrid"></div>
      </section>

      <section class="card">
        <h2>✨ Hiasan</h2>
        <div class="sticker-row" id="stickerRow"></div>
        <input type="text" id="captionInput" maxlength="30" placeholder="Tulis caption strip kamu..." />
      </section>

      <section class="card shots-card">
        <div class="shots-head">
          <h2>🧷 Hasil Foto</h2>
          <button class="text-btn" id="clearBtn">Bersihkan</button>
        </div>
        <div class="shots" id="shots">
          <p class="shots-empty">Belum ada foto. Klik tombol besar buat mulai!</p>
        </div>
        <div class="actions">
          <button class="primary-btn" id="downloadBtn" disabled>⬇️ Download</button>
        </div>
      </section>
    </aside>
  </main>

  <footer class="foot">Dibuat dengan 💛 — SnapBooth</footer>

  <script src="app.js"></script>
</body>
</html>
